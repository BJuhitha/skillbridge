<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillBridge</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);">

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <span>SkillBridge</span>
            </a>
            <div id="nav-user-area" class="nav-user"></div>
        </div>
    </nav>

    <main class="main-content" style="display:flex;align-items:center;justify-content:center;min-height:75vh;">
        <div class="card" style="max-width: 440px; width: 100%; padding: 2rem;">
            <div style="text-align:center;margin-bottom:1.5rem;">
                <h2 style="font-size:1.6rem;font-weight:700;">Student Login</h2>
                <p style="font-size:0.88rem;color:var(--text-secondary);">Enter your college credentials to continue</p>
            </div>

            <!-- Demo Quick Login Buttons -->
            <div style="background:#f1f5f9;border:1px dashed #cbd5e1;padding:0.75rem;border-radius:var(--radius-sm);margin-bottom:1.5rem;">
                <div style="font-size:0.75rem;font-weight:700;color:var(--text-secondary);margin-bottom:0.4rem;text-transform:uppercase;">
                    ⚡ 1-Click Demo Logins
                </div>
                <div style="display:flex;gap:0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="quickLogin('studenta@college.edu', 'password123')">
                        👨‍💻 Student A (Java)
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="quickLogin('studentb@college.edu', 'password123')">
                        🎨 Student B (Photoshop)
                    </button>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">College Email</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g. studenta@college.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;padding:0.75rem;">
                    Sign In
                </button>
            </form>

            <div style="text-align:center;margin-top:1.25rem;font-size:0.88rem;color:var(--text-secondary);">
                Don't have an account? <a href="register.html" style="font-weight:600;">Sign up here</a>
            </div>
        </div>
    </main>

    <footer>
        <p>SkillBridge &copy; 2026 &bull; Student Skill Exchange Platform</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
