# SkillBridge Application Configuration
spring.application.name=SkillBridge
server.port=${PORT:8080}


# -------------------------------------------------------------
# DEFAULT PROFILE: H2 Database (Ready-to-run zero-setup mode)
# You can run immediately without starting any MySQL server!
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:skillbridge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------
# TO SWITCH TO MYSQL:
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or in IDE, set VM argument: -Dspring.profiles.active=mysql
# Or comment the H2 lines above and uncomment the MySQL lines below:
# -------------------------------------------------------------
